<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Cards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="suit-screen" class="screen active">
    <h1>Choose a suit</h1>
    <div class="suit-list" id="suit-list"></div>
  </div>

  <div id="card-screen" class="screen">
    <button id="back-btn" aria-label="Choose a different suit">&#8592; Suits</button>
    <div id="card-tap-area">
      <img id="card-image" src="" alt="">
      <div id="card-label">
        <span id="card-suit-label"></span>
        <span id="card-name-label"></span>
      </div>
    </div>
    <p id="hint">Tap to draw another</p>
  </div>

  <script src="cards-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
